[project]
name = "padawan-backend"
version = "0.1.0"
description = "Padawan API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",        # Nebius Token Factory is OpenAI-compatible
    "supabase>=2.8",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
